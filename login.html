<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вхід в акаунт</title>
  <link rel="stylesheet" href="css/login.css">
  
</head>
<body>
  <div class="login-card">
    <h1>Ласкаво просимо</h1>
    <div class="subtitle">Якщо у вас нема акаунту, зверніться в підтримку</div>

    <div id="errorMessage" class="error-msg"></div>

    <form id="loginForm">
      <div class="input-group">
        <label for="username">Email</label>
        <input type="text" id="username" class="input-field" placeholder="ivan@example.com" autocomplete="username">
      </div>

      <div class="input-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" class="input-field" placeholder="••••••••" autocomplete="current-password">
      </div>
      <div class="options">
        <label class="checkbox">
          <input type="checkbox" id="remember"> Запам'ятати мене
        </label>
        <a href="#" class="forgot-link">Забули пароль?</a>
      </div>


      
        <button type="submit" onclick="window.location.href='profile.html'">Війти</button>
      

    </form>

    <!-- <div class="signup-prompt">
      Нет аккаунта? <a href="#">Зарегистрироваться</a>
    </div> -->
    <a href="index.html" class="back-home">← На гловну</a>
  </div>

  <script>
    // Демонстрационная обработка формы (без реального бэкенда)
    // В реальном проекте вы замените action, метод и удалите этот скрипт или оставите валидацию
    const form = document.getElementById('loginForm');
    const errorDiv = document.getElementById('errorMessage');

    form.addEventListener('submit', function(event) {
      event.preventDefault(); // Отменяем отправку на сервер (для демо)

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const remember = document.getElementById('remember').checked;

      // Простейшая проверка
      if (!username || !password) {
        errorDiv.style.display = 'block';
        errorDiv.textContent = '❌ Пожалуйста, заполните и логин, и пароль.';
        return;
      }

      errorDiv.style.display = 'none';

      // Имитация успешного входа (можно убрать и реально отправить на сервер)
      alert(`Успешный вход!\nЛогин: ${username}\nЗапомнить: ${remember ? 'Да' : 'Нет'}\n\n(В реальном проекте здесь будет редирект или POST-запрос)`);
      
      // Если хотите действительно отправить данные на сервер, раскомментируйте следующие строки:
      // form.method = 'POST';
      // form.action = '/login';   // или '/api/login'
      // form.submit();
      
      // Либо перенаправьте пользователя на личный кабинет
      // window.location.href = '/dashboard';
    });

    // Просто для красоты: убираем ошибку при начале ввода
    const inputs = document.querySelectorAll('.input-field');
    inputs.forEach(input => {
      input.addEventListener('input', () => {
        errorDiv.style.display = 'none';
      });
    });
  </script>
</body>
</html>
