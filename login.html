<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вхід в акаунт</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-card">
    <h1>Ласкаво просимо</h1>
    <div class="subtitle">Якщо у вас нема акаунту, зверніться в підтримку</div>

    <div id="errorMessage" class="error-msg"></div>

    <form id="loginForm">
      <div class="input-group">
        <label for="username">Email</label>
        <input type="email" id="username" class="input-field" placeholder="ivan@example.com" autocomplete="username" required>
      </div>

      <div class="input-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" class="input-field" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      
      <div class="options">
        <label class="checkbox">
          <input type="checkbox" id="remember"> Запам'ятати мене
        </label>
        <a href="#" class="forgot-link">Забули пароль?</a>
      </div>

      <button type="submit" id="submitBtn">Увійти</button>
    </form>

    <a href="index.html" class="back-home">← На головну</a>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
