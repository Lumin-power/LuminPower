<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
  rel="stylesheet"
  href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"
/>
</head>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

<style>
    .calculator {
    display: flex;
    gap: 30px;
    margin-top: 40px;
}

#map {
    width: 70%;
    height: 600px;
}

.result {
    width: 30%;
    padding: 20px;
    border: 1px solid #ddd;
    border-radius: 10px;
}
</style>

<body>
    <section class="calculator">

    <div id="map"></div>

    <div class="result">

        <h2>Результат расчёта</h2>

        <p>Площадь: <span id="area">0</span> м²</p>

        <p>Полезная площадь: <span id="usableArea">0</span> м²</p>

        <p>Количество панелей: <span id="panels">0</span></p>

        <p>Мощность станции: <span id="power">0</span> кВт</p>

    </div>

</section>

<script>
    const map = L.map("map").setView([47.9105, 33.3918], 12);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution: "&copy; OpenStreetMap"
  }
).addTo(map);

const drawnItems = new L.FeatureGroup();

map.addLayer(drawnItems);

const drawControl = new L.Control.Draw({
  draw: {
    polygon: true,
    rectangle: true,
    circle: false,
    marker: false,
    polyline: false,
    circlemarker: false
  },
  edit: {
    featureGroup: drawnItems
  }
});

map.addControl(drawControl);

map.on(L.Draw.Event.CREATED, function (event) {

    drawnItems.clearLayers();

    const layer = event.layer;

    drawnItems.addLayer(layer);

    const geojson = layer.toGeoJSON();

    const area = turf.area(geojson);

    calculate(area);
});

function calculate(area) {

    const usefulArea = area * 0.95;

    const panelArea = 2.3;

    const panelPower = 0.6;

    const panelsCount =
        Math.floor(usefulArea / panelArea);

    const totalPower =
        panelsCount * panelPower;

    document.getElementById("area")
        .textContent = area.toFixed(2);

    document.getElementById("usableArea")
        .textContent = usefulArea.toFixed(2);

    document.getElementById("panels")
        .textContent = panelsCount;

    document.getElementById("power")
        .textContent = totalPower.toFixed(2);
}

</script>
</body>
</html>
